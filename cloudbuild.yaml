# Google Cloud Build 設定檔 (專案根目錄)
# 用法：gcloud builds submit --config=cloudbuild.yaml .

steps:
  # 1. 自動建置並部署 Backend 至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crm-backend'
      - '--source=./sourcecode/backend'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=USE_SMALL_MODEL=true,RAG_ENGINE=gemini'

  # 2. 自動建置並部署 Frontend 至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crm-frontend'
      - '--source=./sourcecode/frontend'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

options:
  logging: CLOUD_LOGGING_ONLY
