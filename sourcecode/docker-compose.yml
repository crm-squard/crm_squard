version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - USE_SMALL_MODEL=true
      - RAG_ENGINE=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - chroma_data:/app/chroma_data
      - chroma_online_data:/app/chroma_online_data
    restart: always

  corp-backend:
    build:
      context: ./corp-backend
      dockerfile: Dockerfile
    container_name: corp_backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_CORP_URL: ${VITE_API_CORP_URL:-http://localhost:8001}
    container_name: crm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - corp-backend
    restart: always

volumes:
  chroma_data:
  chroma_online_data:
