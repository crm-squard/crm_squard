version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - USE_SMALL_MODEL=true
      - RAG_ENGINE=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - chroma_data:/app/chroma_data
      - chroma_online_data:/app/chroma_online_data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: crm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  chroma_data:
  chroma_online_data:
