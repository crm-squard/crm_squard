<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM Chat Widget 獨立預覽頁面。" />
    <title>CRM Chat Widget Preview</title>
    <style>
      :root {
        color: #17212b;
        background: #f4f7f9;
        font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        max-width: 720px;
        padding: 64px 32px;
      }

      h1 {
        margin: 0 0 12px;
        color: #1f3d57;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
      }

      p {
        max-width: 560px;
        margin: 0;
        color: #5d6b78;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CRM Chat Widget</h1>
      <p>此頁面用於本機及部署後的獨立介面驗證，聊天元件會自動顯示於右下角。</p>
    </main>
    <script>
      // 讀取網址的 clientId 參數，讓 https://.../?clientId=<商家 chatbot UUID>
      // 可直接跳轉到對應商家的機器人；未帶參數時維持預設的 client_demo。
      (function () {
        var clientId =
          new URLSearchParams(window.location.search).get("clientId") ||
          "client_demo";
        var script = document.createElement("script");
        script.src = "/chat-widget.js";
        script.dataset.clientId = clientId;
        script.defer = true;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
